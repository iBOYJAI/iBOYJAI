<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Jaiganesh D, iBOY. AI systems builder and full-stack developer from Tamil Nadu. Open to projects and roles.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B0A"/><stop offset="1" stop-color="#0C1A15"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#00E5A0" stop-opacity="0"/><stop offset=".5" stop-color="#00E5A0"/><stop offset="1" stop-color="#00E5A0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#00E5A0" stop-opacity=".35"/><stop offset="1" stop-color="#00E5A0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="830" cy="90" r="150" fill="url(#glow)">
    <animate attributeName="r" values="130;175;130" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="830;800;830" dur="11s" repeatCount="indefinite"/>
  </circle>
  <g fill="#00E5A0" opacity=".5">
    <circle cx="640" cy="60" r="2"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="220" r="1.6"><animate attributeName="cy" values="220;240;220" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="170" r="2.2"><animate attributeName="cy" values="170;150;170" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="250" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">
    <rect x="60" y="54" width="214" height="30" rx="15" fill="#00E5A0" fill-opacity=".12" stroke="#00E5A0" stroke-opacity=".5"/>
    <circle cx="80" cy="69" r="5" fill="#00E5A0"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="94" y="74" font-size="13" font-weight="600" fill="#A7F3D0">Open to projects and roles</text>

    <text x="60" y="152" font-size="58" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Jaiganesh D
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="60" y="190" font-size="20" fill="#6EE7B7" font-weight="600" letter-spacing="3">iBOY</text>

    <g font-size="21" fill="#D1D5DB">
      <text x="60" y="232" opacity="0">AI systems builder
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.06;.28;.33;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="60" y="232" opacity="0">Full-stack: NestJS, Next.js, Flutter
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.33;.39;.61;.66;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="60" y="232" opacity="0">Solo founder, iBOY Innovation Hub
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.66;.72;.94;1" dur="9s" repeatCount="indefinite"/></text>
    </g>
    <text x="60" y="268" font-size="14" fill="#6B7280">Tamil Nadu, India  ·  Tamil, Tanglish, English</text>
  </g>

  <rect x="60" y="284" width="880" height="2" fill="url(#line)">
    <animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
